name: Code quality
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm build
      - name: Check executable shell scripts
        run: shellcheck lab scripts/bootstrap scripts/cleanup-startup scripts/monitor infrastructure/init-db.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/
            docs/badges/unit-coverage.svg
          if-no-files-found: warn
      - name: Publish coverage when Codecov is configured
        if: env.CODECOV_TOKEN != '' && github.event_name != 'pull_request'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
  ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: ./scripts/bootstrap
      - run: pnpm test:integration
      - run: pnpm test:recovery
      - run: pnpm test:learning
      - run: pnpm test:e2e
      - name: Show startup diagnostics
        if: failure()
        run: |
          for log in .lab/*.stdout.log; do
            [ -f "$log" ] || continue
            echo "$log"
            tail -n 60 "$log"
          done
          lsof -nP -iTCP -sTCP:LISTEN || true
          ps -eo pid,ppid,args
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ecosystem-diagnostics
          include-hidden-files: true
          path: |
            test-results/
            .lab/logs/
            .lab/*.stdout.log
      - run: ./lab stop
        if: always()
